[workspace]
authors = ["rashid <muhammad.rashid@unito.it>"]
name = "advis"
version = "0.1.1"
platforms = [
  "linux-64",
  "osx-arm64",
]

# Keep conda-forge first for generic deps.
channels = [
  "nvidia",
  "https://prefix.dev/conda-forge",
  "robostack-kilted",
  "pytorch"
]

[activation.env]
PYTHONPATH = "${PIXI_PROJECT_ROOT}/src:${PYTHONPATH}"
RMW_IMPLEMENTATION = "rmw_cyclonedds_cpp"
ROS_DOMAIN_ID="1"


[dependencies]
python = "3.12.*"
cython = ">=3,<4"
# PyTorch from the macOS channel is built against the NumPy 1.x ABI.
numpy = { version = ">=1.26,<2", channel = "https://prefix.dev/conda-forge" }

pytorch = { version = "*", channel = "pytorch" }
torchvision = { version = "*", channel = "pytorch" }


scipy = ">=1.17.1,<2"
matplotlib = ">=3.10.8,<4"
plotly = ">=6.6.0,<7"
scikit-image = ">=0.26.0,<0.27"
tqdm = ">=4.67.3,<5"
scikit-learn = ">=1.8.0,<2"
pandas = ">=3.0.2,<4"


ros-kilted-rclpy = "*"
ros-kilted-sensor-msgs = ">=5.5.1,<6"
ros-kilted-cv-bridge = "*"
ros-kilted-rosbag2-py = "*"
ros-kilted-rosbag2-storage-mcap = "*"
ros-kilted-ros-base = "*"

ros-kilted-rmw-cyclonedds-cpp = "*"

# Linux HP workstation: CUDA acceleration and the existing site-specific DDS
# configuration. These packages are not requested by the macOS solver.
[target.linux-64.dependencies]
mkl = { version = "*", channel = "https://prefix.dev/conda-forge" }
pytorch-cuda = { version = "12.1.*", channel = "pytorch" }

[target.linux-64.activation.env]
CYCLONEDDS_URI = "/home/unito/dm/distrimuse-seds/cyclonedds.xml"

# Apple Silicon: PyTorch uses its built-in MPS backend. CUDA and MKL are
# deliberately omitted, and CycloneDDS uses the portable macOS configuration.
[target.osx-arm64.activation.env]
CYCLONEDDS_URI = "file://${PIXI_PROJECT_ROOT}/configs/cyclonedds-macos.xml"

[pypi-dependencies]
huggingface-hub = ">=2.0.0, <3"
